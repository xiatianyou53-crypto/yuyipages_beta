<!DOCTYPE html>
<html lang="{{ site.Language.Locale | default "zh-cn" }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  {{ partial "head.html" . }}
  {{ block "extra_head" . }}{{ end }}
</head>
<body>
  {{ partial "header.html" . }}
  <main class="site-main">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "scripts.html" . }}
  {{ block "scripts" . }}{{ end }}
</body>
</html>
