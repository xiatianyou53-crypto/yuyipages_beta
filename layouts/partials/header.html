<header class="site-header">
  <div class="masthead">
    <div class="container masthead-inner">
      <a class="brand" href="/">
        <img class="brand-logo" src="/images/logo.svg" alt="{{ site.Title }} 标志" width="480" height="148">
      </a>
      <p class="masthead-tag">{{ site.Params.heroSubtitle }}</p>
      <time class="masthead-date" data-live-clock datetime="{{ now.Format "2006-01-02T15:04:05Z07:00" }}">{{ now.Format "2006年01月02日" }}</time>
    </div>
  </div>
  <div class="site-nav">
    <div class="container nav-inner">
      <button class="nav-toggle" id="navToggle" aria-label="打开菜单" aria-controls="mainNav" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
      <nav class="main-nav" id="mainNav" aria-label="主导航">
        <ul class="nav-list">
          {{- range site.Menus.main }}
          <li class="nav-item"><a href="{{ .URL | relLangURL }}"{{ if $.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ end }}>{{ .Name }}</a></li>
          {{- end }}
        </ul>
      </nav>
    </div>
  </div>
</header>
