<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>内容后台 · 辽宁省实验中学语意报社</title>
  <!-- 后台需要网络加载 Decap CMS，因此 /admin 页面上传阶段需联网 -->
</head>
<body>
  <script src="https://unpkg.com/decap-cms@^3.3.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      var CMS = window.CMS;
      if (!CMS || !CMS.registerWidget || !window.createClass || !window.h) return;

      function parseParts(value) {
        var match = /^(\d{4})-(\d{1,2})(?:-(\d{1,2}))?/.exec(String(value || ''));
        if (!match) return { year: new Date().getFullYear(), month: new Date().getMonth() + 1, day: '' };
        return { year: Number(match[1]), month: Number(match[2]), day: match[3] && match[3] !== '01' ? match[3] : '' };
      }

      function pad(value) { return value < 10 ? '0' + value : String(value); }

      var YuiYmdControl = createClass({
        handleChange: function (part, event) {
          var parts = parseParts(this.props.value);
          parts[part] = event.target.value;
          var year = Number(parts.year);
          var month = Number(parts.month);
          var day = parts.day ? Math.min(Number(parts.day), new Date(year, month, 0).getDate()) : 1;
          this.props.onChange(year + '-' + pad(month) + '-' + pad(day));
        },
        render: function () {
          var parts = parseParts(this.props.value);
          var years = [];
          for (var year = new Date().getFullYear() + 1; year >= 2006; year--) {
            years.push(h('option', { key: year, value: year }, year + ' 年'));
          }
          var months = [];
          for (var month = 1; month <= 12; month++) {
            months.push(h('option', { key: month, value: month }, month + ' 月'));
          }
          var days = [h('option', { key: 'none', value: '' }, '日期（不填按1日）')];
          for (var day = 1; day <= 31; day++) {
            days.push(h('option', { key: day, value: day }, day + ' 日'));
          }
          var selectStyle = { marginRight: '8px', minWidth: '100px' };
          return h('div', { className: this.props.classNameWrapper },
            h('select', { id: this.props.forID, value: parts.year, style: selectStyle, onChange: this.handleChange.bind(this, 'year') }, years),
            h('select', { value: parts.month, style: selectStyle, onChange: this.handleChange.bind(this, 'month') }, months),
            h('select', { value: parts.day, style: selectStyle, onChange: this.handleChange.bind(this, 'day') }, days)
          );
        }
      });

      var YuiYmdPreview = createClass({
        render: function () {
          var parts = parseParts(this.props.value);
          return h('span', {}, parts.year + '年' + parts.month + '月' + (parts.day ? parts.day + '日' : '（日期按1日）'));
        }
      });

      CMS.registerWidget('yuyi-ymd', YuiYmdControl, YuiYmdPreview);
    })();
  </script>
  <!-- 配置文件默认读取本目录下的 config.yml -->
</body>
</html>
