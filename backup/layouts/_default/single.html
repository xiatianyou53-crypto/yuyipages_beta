{{ define "main" }}
<div class="container page-wrap narrow">
  <nav class="breadcrumb"><a href="/">首页</a> › <span>{{ .Title }}</span></nav>
  <article class="prose-card">
    <header class="page-head">
      <h1 class="page-title">{{ .Title }}</h1>
      {{ with .Date }}<p class="card-meta">{{ .Format "2006年01月02日" }}</p>{{ end }}
    </header>
    {{ with .Params.cover }}<img class="page-cover" src="{{ . }}" alt="{{ $.Title }}" loading="lazy">{{ end }}
    <div class="prose">
      {{ .Content }}
    </div>
  </article>
</div>
{{ end }}
